# Fly 全栈编排：PostgreSQL + Java 后端 + Next.js 前端 + Nginx
# 使用前：cp .env.example .env 并填写 FLY_SECRET_KEY 等配置
# 启动：docker compose up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: fly
      # 管理员初始密码（必填，仅首次初始化生效；未设置时 compose 拒绝启动）
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:?请先复制 .env.example 为 .env 并设置 ADMIN_INITIAL_PASSWORD（强密码）}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 首次启动自动建表 + 种子数据（:z 兼容 SELinux enforcing 的 Linux 主机）
      - ./fly-backend/init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro,z
      # 建表后创建管理员账号（zz- 前缀保证在 init.sql 之后执行）
      - ./fly-backend/init_admin.sh:/docker-entrypoint-initdb.d/zz-init-admin.sh:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fly"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./fly-backend
    # 显式镜像名：保证换目录/换服务器 docker save/load 后 up 直接命中，不重复构建
    image: fly-backend:1.0.1
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/fly
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      FLY_SECRET_KEY: ${FLY_SECRET_KEY:?请先复制 .env.example 为 .env 并设置 FLY_SECRET_KEY（至少 32 字符）}
      # CORS 白名单必须含线上域名（浏览器同源 POST 也带 Origin 头，缺失则 POST 全部 403）
      FLY_CORS_ORIGINS: ${FLY_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,https://your-domain.com}
      FLY_OSS_ACCESS_KEY_ID: ${FLY_OSS_ACCESS_KEY_ID:-}
      FLY_OSS_ACCESS_KEY_SECRET: ${FLY_OSS_ACCESS_KEY_SECRET:-}
      FLY_OSS_BUCKET_NAME: ${FLY_OSS_BUCKET_NAME:-}
      FLY_OSS_ENDPOINT: ${FLY_OSS_ENDPOINT:-}
      FLY_OSS_CUSTOM_DOMAIN: ${FLY_OSS_CUSTOM_DOMAIN:-}
      FLY_OSS_PREFIX: ${FLY_OSS_PREFIX:-Boke/}
      # 本地音乐目录（容器内路径；扫描导入不复制文件）
      FLY_MUSIC_DIRS: ${FLY_MUSIC_DIRS:-/music/120;/music/mp3}
    volumes:
      # 本地上传目录（与原 FastAPI uploads/ 目录对应；:z 兼容 SELinux）
      - ./fly-backend/uploads:/app/uploads:z
      # 本地音乐目录（只读；默认相对路径 Linux/Windows 通用，Windows 可在 .env 指向实际磁盘）
      - ${MUSIC_DIR_120:-./data/music/120}:/music/120:ro,z
      - ${MUSIC_DIR_MP3:-./data/music/mp3}:/music/mp3:ro,z
    # 8000 端口仅用于本机调试，正式访问走 Nginx（80）
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: ./fly
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:8000}
        NOVEL_API_URL: ${NOVEL_API_URL:-}
    # 显式镜像名：保证换目录/换服务器 docker save/load 后 up 直接命中，不重复构建
    image: fly-frontend:1.0.1
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:8000}
      # rewrite 与 next/image 优化器的后端地址（容器网络内）
      API_INTERNAL_URL: http://backend:8000
      NOVEL_API_URL: ${NOVEL_API_URL:-}
    # 3000 端口仅用于本机调试，正式访问走 Nginx（80）
    ports:
      - "127.0.0.1:3000:3000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro,z
      # HTTPS 证书：fullchain.pem + privkey.pem 放宿主机 deploy/certs/（首次启用前必须就位）
      - ./deploy/certs:/etc/nginx/certs:ro,z

volumes:
  pgdata:
