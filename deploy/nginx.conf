# Fly 全栈反向代理
# 前端 :3000 / 后端 :8000 由 docker-compose 服务名解析
# HTTPS：80 全部 301 → 443；证书在宿主机 deploy/certs/（fullchain.pem + privkey.pem）

upstream frontend_server {
    server frontend:3000;
}

upstream backend_server {
    server backend:8000;
}

# ---- 防刷/配额保护：按来源 IP 限流（后端无内置限流层，nginx 为统一闸门）----
# 每 IP 连接数上限（全站）
limit_conn_zone $binary_remote_addr zone=addr_conn:10m;
# 通用 API：30 r/s（正常浏览/搜索足够）
limit_req_zone $binary_remote_addr zone=api_rate:10m rate=30r/s;
# 音乐歌单（网易云配额）：2 r/s
limit_req_zone $binary_remote_addr zone=music_rate:10m rate=2r/s;
# uapis 开放代理（免费配额）：5 r/s
limit_req_zone $binary_remote_addr zone=uapis_rate:10m rate=5r/s;
# 登录防爆破：1 r/s
limit_req_zone $binary_remote_addr zone=login_rate:10m rate=1r/s;
# 小说外部源代理：10 r/s（搜索 SSE/封面/目录的正常突发）
limit_req_zone $binary_remote_addr zone=reader_rate:10m rate=10r/s;

# ---- HTTP：仅跳转 HTTPS ----
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# ---- HTTPS ----
server {
    listen 443 ssl;
    http2 on;
    server_name feifei520.cn;

    # 证书：宿主机 deploy/certs/ 挂载到 /etc/nginx/certs（见 docker-compose.yml）
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 稳定运行后再开启（开启后浏览器一年内强制走 HTTPS，撤销成本高）
    # add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 100m;

    # 每 IP 并发连接数
    limit_conn addr_conn 40;
    limit_req_status 429;
    limit_conn_status 429;

    # 防 MIME 嗅探（配合上传白名单，避免图片被浏览器当作 HTML/SVG 执行）
    add_header X-Content-Type-Options nosniff always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # 覆写而非追加（$proxy_add_x_forwarded_for）：nginx 是唯一可信边界，
    # 客户端伪造的 X-Forwarded-For 在此丢弃，后端取首段即为真实来源 IP
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---- 登录防爆破（须在 /api/ 之前精确匹配）----
    location = /api/auth/login {
        limit_req zone=login_rate burst=5 nodelay;
        proxy_pass http://backend_server;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    # ---- 音乐歌单（Next.js Meting 路由，精确匹配不拦截 /api/music/local 等后端接口）----
    location = /api/music {
        limit_req zone=music_rate burst=10 nodelay;
        proxy_pass http://frontend_server;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    # ---- 前端自有 API 路由（Next.js route handler）----
    # 必须先于 /api/ 匹配，否则 /api/uapis 被截给 Java 后端返回 404
    location /api/uapis {
        limit_req zone=uapis_rate burst=10 nodelay;
        proxy_pass http://frontend_server;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    # ---- API → Java 后端 ----
    location /api/ {
        limit_req zone=api_rate burst=40 nodelay;
        proxy_pass http://backend_server;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }

    # ---- 上传文件 → Java 后端 ----
    location /uploads/ {
        proxy_pass http://backend_server;
    }

    # ---- 管理后台（Next.js /admin：登录 + 留言审核 + 书架 + 站点配置）→ 前端 ----
    # 后端仍保留 Vue 后台静态资源，但不再经由 nginx 暴露
    location = /admin {
        proxy_pass http://frontend_server;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /admin/ {
        proxy_pass http://frontend_server;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ---- 小说阅读服务（Java reader3 协议：搜索/目录/正文/封面）----
    location /reader3/ {
        limit_req zone=reader_rate burst=30 nodelay;
        proxy_pass http://backend_server;
        proxy_set_header Host $host;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;

        # SSE（EventSource）必须关闭缓冲，否则搜索流式结果被攒住
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ---- 静态资源长缓存（哈希资源 + 公共图片/看板娘模型）----
    # 用 expires 而非 add_header：避免覆盖 server 级的 nosniff 头
    location /_next/static/ {
        proxy_pass http://frontend_server;
        expires 365d;
    }
    location /images/ {
        proxy_pass http://frontend_server;
        expires 30d;
    }
    location /live2d/ {
        proxy_pass http://frontend_server;
        expires 30d;
    }

    # ---- 前端（Next.js） ----
    location / {
        proxy_pass http://frontend_server;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 30s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 30s;

        # 关键：禁用代理缓存，否则重新部署后会返回旧 HTML
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_cache off;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
}
